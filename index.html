<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saddleback Bakery Blog Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFE4B5 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(139, 69, 19, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #D2691E 0%, #8B4513 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .section {
            background: #FFFAF0;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #FFE4B5;
        }

        .section h2 {
            color: #8B4513;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.3em;
        }

        label {
            display: block;
            color: #654321;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #DEB887;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #D2691E;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .suggestions {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-btn {
            background: white;
            border: 2px solid #FFE4B5;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            color: #654321;
            font-size: 0.95em;
        }

        .suggestion-btn:hover {
            background: #FFF8E7;
            border-color: #D2691E;
            transform: translateX(5px);
        }

        .generate-btn {
            background: linear-gradient(135deg, #D2691E 0%, #8B4513 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-area {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #DEB887;
            min-height: 400px;
            line-height: 1.8;
            color: #333;
        }

        .preview-area h3 {
            color: #8B4513;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .preview-area p {
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .export-btn {
            flex: 1;
            background: white;
            border: 2px solid #D2691E;
            color: #8B4513;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .export-btn:hover {
            background: #D2691E;
            color: white;
        }

        .export-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #8B4513;
            font-style: italic;
            padding: 40px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥐 Saddleback Bakery Blog Generator</h1>
            <p>Create warm, inviting blog posts for your bakery</p>
        </div>

        <div class="main-content">
            <div>
                <div class="section">
                    <h2><span class="icon">✍️</span> Create Your Blog Post</h2>
                    
                    <label for="topic">Blog Topic</label>
                    <input type="text" id="topic" placeholder="e.g., Our New Sourdough Recipe">
                    
                    <label for="draft">Your Draft</label>
                    <textarea id="draft" placeholder="Share your initial thoughts, key points, or story ideas..."></textarea>
                    
                    <button class="generate-btn" id="generateBtn">Generate Blog Post</button>
                </div>

                <div class="section">
                    <h2><span class="icon">💡</span> Seasonal Blog Ideas</h2>
                    <div class="suggestions">
                        <button class="suggestion-btn" data-topic="Pumpkin Spice Delights for Fall" data-draft="Our pumpkin spice collection brings warmth to autumn mornings. From classic pumpkin bread to innovative spiced muffins, we're celebrating the season's favorite flavors.">
                            🎃 Pumpkin Spice Delights for Fall
                        </button>
                        <button class="suggestion-btn" data-topic="Summer Lemon Tart Specials" data-draft="Beat the heat with our refreshing lemon tarts. Bright citrus flavors and buttery crusts make these the perfect summer treat.">
                            🍋 Summer Lemon Tart Specials
                        </button>
                        <button class="suggestion-btn" data-topic="Valentine's Day Chocolate Collection" data-draft="Show your love with our handcrafted chocolate treats. From rich brownies to elegant chocolate-covered strawberries, we've got something for everyone.">
                            ❤️ Valentine's Day Chocolate Collection
                        </button>
                        <button class="suggestion-btn" data-topic="Spring Berry Pastries" data-draft="Spring berries are here! Our pastry chefs are creating delightful treats featuring fresh strawberries, blueberries, and raspberries.">
                            🍓 Spring Berry Pastries
                        </button>
                        <button class="suggestion-btn" data-topic="Holiday Cookie Gift Boxes" data-draft="Our holiday cookie boxes make perfect gifts. Each box is filled with an assortment of festive favorites, beautifully packaged and ready to share.">
                            🎄 Holiday Cookie Gift Boxes
                        </button>
                        <button class="suggestion-btn" data-topic="Back-to-School Breakfast Treats" data-draft="Start the school year right with our quick and delicious breakfast options. Muffins, croissants, and breakfast bars that fuel busy mornings.">
                            📚 Back-to-School Breakfast Treats
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <div class="section">
                    <h2><span class="icon">📄</span> Blog Preview</h2>
                    <div class="preview-area" id="preview">
                        <div class="empty-state">
                            Your generated blog post will appear here. Enter a topic and draft, then click "Generate Blog Post" to get started!
                        </div>
                    </div>
                    <div class="export-buttons">
                        <button class="export-btn" id="exportRtf" disabled>Download as RTF</button>
                        <button class="export-btn" id="exportTxt" disabled>Download as Text</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let generatedBlog = null;
        let currentTopic = '';

        // Suggestion button handlers
        document.querySelectorAll('.suggestion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('topic').value = btn.dataset.topic;
                document.getElementById('draft').value = btn.dataset.draft;
            });
        });

        // Generate blog post
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const topic = document.getElementById('topic').value.trim();
            const draft = document.getElementById('draft').value.trim();

            if (!topic || !draft) {
                alert('Please enter both a topic and a draft to generate your blog post.');
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            const preview = document.getElementById('preview');
            
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            preview.innerHTML = '<div class="loading">✨ Baking up your blog post...</div>';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `You are a warm, friendly bakery blog writer for Saddleback Bakery. Expand this draft into a 400-600 word blog post that's inviting and engaging.

Topic: ${topic}

Draft: ${draft}

Requirements:
- Warm, friendly, conversational tone
- Include sensory details (smells, textures, tastes)
- Create connection with readers who love fresh baked treats
- Use bakery-specific themes
- Make it feel personal and authentic
- 400-600 words

Write ONLY the blog post content, no preamble or metadata. Start directly with the content.`
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.content && data.content[0] && data.content[0].text) {
                    generatedBlog = data.content[0].text;
                    currentTopic = topic;
                    
                    preview.innerHTML = `<h3>${topic}</h3>${generatedBlog.split('\n\n').map(p => `<p>${p}</p>`).join('')}`;
                    
                    document.getElementById('exportRtf').disabled = false;
                    document.getElementById('exportTxt').disabled = false;
                } else {
                    throw new Error('Unexpected response format');
                }
            } catch (error) {
                console.error('Error generating blog:', error);
                preview.innerHTML = '<div class="empty-state">Sorry, there was an error generating your blog post. Please try again.</div>';
                alert('Failed to generate blog post. Please try again.');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Blog Post';
            }
        });

        // Export as RTF
        document.getElementById('exportRtf').addEventListener('click', () => {
            if (!generatedBlog) return;

            try {
                const rtfContent = `{\\rtf1\\ansi\\deff0
{\\fonttbl{\\f0\\froman Georgia;}}
{\\colortbl;\\red139\\green69\\blue19;}
\\f0\\fs24
\\qc\\b\\fs32 Saddleback Bakery Blog\\b0\\fs24\\par
\\par
\\ql\\b\\fs28\\cf1 ${currentTopic}\\b0\\cf0\\fs24\\par
\\par
${generatedBlog.split('\n\n').map(p => p.replace(/\n/g, '\\par\n') + '\\par\n\\par\n').join('')}
\\par
\\qc\\i Visit us at Saddleback Bakery for fresh-baked goodness every day!\\i0\\par
}`;

                const blob = new Blob([rtfContent], { type: 'application/rtf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentTopic.replace(/[^a-z0-9]/gi, '_')}.rtf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Export error:', error);
                alert('Failed to export RTF file. Please try again.');
            }
        });

        // Export as Text
        document.getElementById('exportTxt').addEventListener('click', () => {
            if (!generatedBlog) return;

            try {
                const txtContent = `SADDLEBACK BAKERY BLOG

${currentTopic}

${generatedBlog}

---
Visit us at Saddleback Bakery for fresh-baked goodness every day!`;

                const blob = new Blob([txtContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentTopic.replace(/[^a-z0-9]/gi, '_')}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Export error:', error);
                alert('Failed to export text file. Please try again.');
            }
        });
    </script>
</body>
</html>
